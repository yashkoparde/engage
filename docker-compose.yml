version: '3.8'

services:
  faculty:
    build:
      context: .
      dockerfile: apps/faculty/Dockerfile
    ports:
      - "5173:5173"
    environment:
      - VITE_SUPABASE_URL=${VITE_SUPABASE_URL}
      - VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY}

  student:
    build:
      context: .
      dockerfile: apps/student/Dockerfile
    ports:
      - "5174:5174"
    environment:
      - VITE_SUPABASE_URL=${VITE_SUPABASE_URL}
      - VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY}
